<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Bike4 Service</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1 class="fade-in">BIKE4 SERVICS</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="contact slide-in">
    <h2>Contact Us</h2>
    <p>Reach out for bookings, inquiries, or service updates.</p>
    <form>
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name" required><br><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="message">Message:</label><br>
      <textarea id="message" name="message" required></textarea><br><br>

      <button type="submit" class="btn">Send</button>
    </form>
  </section>

  <section class="feedback zoom-in">
    <h2>Feedback</h2>
    <p>We value your opinion! Share your experience with us.</p>
    <form>
      <label for="rating">Rate our service:</label><br>
      <select id="rating" name="rating">
        <option>Excellent</option>
        <option>Good</option>
        <option>Average</option>
        <option>Poor</option>
      </select><br><br>

      <label for="comments">Your Feedback:</label><br>
      <textarea id="comments" name="comments"></textarea><br><br>

      <button type="submit" class="btn">Submit Feedback</button>
    </form>
  </section>

  <footer>
    <p>&copy;  Bike4 Service</p>
  </footer>
</body>
</html>
